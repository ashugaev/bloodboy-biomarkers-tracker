name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: github-pages
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          BASE_URL: ${{ vars.BASE_URL || '/' }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ vars.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}
          VITE_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.VITE_PUBLIC_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Keep custom domain in the artifact
        run: |
          if [ -f CNAME ]; then
            cp CNAME dist/CNAME
          fi

      - name: Ensure Pages is served by Actions, not a branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          site=$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>/dev/null || echo '{}')
          current=$(printf '%s' "$site" | jq -r '.build_type // "unknown"')
          cname=$(printf '%s' "$site" | jq -r '.cname // empty')
          echo "Pages build_type: $current, cname: ${cname:-none}"
          if [ "$current" != "workflow" ]; then
            echo "::warning::Pages build_type is '$current' - a branch build publishes raw repo source. Switching to 'workflow'."
            args="-f build_type=workflow"
            if [ -n "$cname" ]; then
              args="$args -f cname=$cname"
            fi
            # shellcheck disable=SC2086
            gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" $args \
              || echo "::warning::Could not switch automatically. Set Settings > Pages > Source to 'GitHub Actions' manually."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify live site
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Check deployed site serves the build
        run: |
          urls="${{ needs.deploy.outputs.page_url }}"
          if [ -f CNAME ]; then
            urls="$urls https://$(tr -d '[:space:]' < CNAME)/"
          fi
          status=0
          for url in $urls; do
            bash scripts/verify-site.sh "$url" || status=1
          done
          exit $status

